name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # 변경: 보고 모드 → 게이트 모드 (CRITICAL 있으면 실패)
      - name: Trivy gate (block CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --severity CRITICAL --exit-code 1 --ignore-unfixed --no-progress \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Update manifest (loop test)
        run: |
          echo "image: ghcr.io/${{ github.repository }}:${{ github.sha }}" > manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.txt
          git commit -m "Update manifest to ${{ github.sha }}"
          git push
          
      # 테스트 5: Python 베이스 이미지 비교 (보고 모드, 메인 흐름에 영향 없음)
      - name: Compare - pull & size
        run: |
          docker pull -q python:3.13-alpine
          docker pull -q python:3.13-slim
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | grep python

      - name: Compare - Trivy python alpine
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            python:3.13-alpine

      - name: Compare - Trivy python slim
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            python:3.13-slim
