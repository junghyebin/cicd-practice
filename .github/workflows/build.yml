name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 변경: 바로 push하지 않고 러너 안에만 이미지 생성
      - name: Build image (load only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      # 추가: 내 이미지(nginx:alpine 기반) 스캔
      - name: Trivy scan - my image (alpine)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # 추가: 비교용 - 일반 nginx(Debian 기반) 스캔
      - name: Trivy scan - compare (nginx debian)
        run: |
          docker run --rm aquasec/trivy:latest image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            nginx:latest

      # 변경: 검사 후 push
      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Update manifest (loop test)
        run: |
          echo "image: ghcr.io/${{ github.repository }}:${{ github.sha }}" > manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.txt
          git commit -m "Update manifest to ${{ github.sha }}"
          git push
