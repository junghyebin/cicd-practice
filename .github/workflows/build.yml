name: build-and-push

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
  TRIVY: aquasec/trivy:0.76.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load only)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}

      # 보고: HIGH·CRITICAL 전체 출력 (실패 안 함, 패치 없는 것도 기록)
      - name: Trivy report (HIGH,CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY image \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            $IMAGE

      # 게이트: 고칠 수 있는 CRITICAL만 차단
      - name: Trivy gate (CRITICAL, fixable only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            $IMAGE

      - name: Push image
        run: docker push $IMAGE

      - name: Update manifest
        run: |
          echo "image: $IMAGE" > manifest.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.txt
          git commit -m "Update manifest to ${{ github.sha }}"
          git push
